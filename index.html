<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hugo Cousseau — Université de Caen Normandie</title>
  <style>
    /* Style minimaliste type page universitaire */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
      background: #fafafa;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.2rem; font-weight: 600; }
    p { margin-top: 0; color: #555; }
    hr { border: 0; border-top: 1px solid #ddd; margin: 25px 0; }
    ul { padding-left: 20px; }
    li { margin-bottom: 8px; }
    a { color: #1a5fb4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .muted { color: #777; font-size: 0.9em; }
  </style>
</head>
<body>

  <!-- Informations principales -->
  <header>
    <h1>Hugo Cousseau</h1>
    <p>Étudiant en Licence 1 de Mathématiques — Université de Caen Normandie</p>
  </header>

  <main>
    <!-- Contact / Liens -->
    <section>
      <p>
        <strong>Contact :</strong> 
        <a href="mailto:hugo.cousseau@etu.unicaen.fr">hugo.cousseau@etu.unicaen.fr</a><br>
        <strong>GitHub :</strong> 
        <a href="https://github.com/hugocousseau" target="_blank" rel="noopener">github.com/hugocousseau</a>
      </p>
    </section>

    <hr>

    <!-- Documents & Travaux (Auto-détectés) -->
    <section>
      <h2>Documents &amp; Travaux</h2>
      <p class="muted">Les fichiers ci-dessous sont issus du dossier <code>documents/</code> :</p>
      
      <ul id="documents-list">
        <li class="muted">Chargement des documents...</li>
      </ul>
    </section>
  </main>

  <!-- Script d'auto-détection du dossier documents/ via GitHub -->
  <script>
    // ⚠️ Remplace par ton vrai nom d'utilisateur GitHub et le nom exact de ton dépôt
    const GITHUB_USER = 'hugocousseau';
    const GITHUB_REPO = 'mon-depot-maths';

    async function loadGithubDocuments() {
      const listElement = document.getElementById('documents-list');
      
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/documents`);
        
        if (!response.ok) {
          throw new Error('Dossier introuvable ou vide');
        }

        const files = await response.json();
        const pdfFiles = files.filter(file => file.name.endsWith('.pdf') || file.type === 'file');

        if (pdfFiles.length === 0) {
          listElement.innerHTML = '<li class="muted">Aucun document dans le dossier <code>documents/</code> pour le moment.</li>';
          return;
        }

        listElement.innerHTML = pdfFiles.map(file => `
          <li>
            <a href="${file.download_url}" target="_blank" rel="noopener">${file.name}</a>
          </li>
        `).join('');

      } catch (error) {
        listElement.innerHTML = '<li class="muted">Impossible de charger automatiquement les documents (vérifie le nom du dépôt dans le script).</li>';
      }
    }

    loadGithubDocuments();
  </script>

</body>
</html>
