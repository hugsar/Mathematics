<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Travaux, synthèses et notes de mathématiques de Hugo Cousseau — Université de Caen Normandie.">
  <title>Hugo Cousseau — Mathématiques (Université de Caen)</title>
  
  <style>
    :root {
      --bg: #fcfcfb;
      --text: #222222;
      --muted: #666666;
      --line: #e2e0d8;
      --link: #1a5fb4;
      --link-hover: #0d3c75;
      --card-bg: #f4f3ef;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }

    /* En-tête */
    header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 4px 0;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Sections */
    section {
      margin-bottom: 30px;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 10px;
      border-bottom: 1px dashed var(--line);
      padding-bottom: 4px;
    }

    p { margin-top: 0; }

    /* Liens & Contact */
    a {
      color: var(--link);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
      color: var(--link-hover);
    }

    .info-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 16px;
      font-size: 0.9rem;
    }

    .info-label {
      font-weight: 600;
      color: var(--muted);
    }

    /* Liste des documents */
    .doc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .doc-item {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .doc-name {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .doc-link {
      font-size: 0.85rem;
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .muted-text {
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* Pied de page */
    footer {
      border-top: 1px solid var(--line);
      padding-top: 20px;
      margin-top: 40px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* Icône ORCID */
    .orcid-icon {
      display: inline-block;
      vertical-align: middle;
      width: 14px;
      height: 14px;
      margin-right: 3px;
    }
  </style>
</head>
<body>

  <!-- En-tête Profil -->
  <header>
    <h1>Hugo Cousseau</h1>
    <p class="subtitle">Étudiant en Licences de Mathématiques — Université de Caen Normandie</p>
  </header>
